# Netlify Configuration
# Optimización y headers de seguridad para SR Studio Salon

# Build settings
[build]
  publish = "."
  command = "echo 'No build needed - static site'"

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    # Seguridad
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    
    # Performance
    Cache-Control = "public, max-age=31536000, immutable"

# Cache específico para HTML (menos agresivo)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache para CSS y JS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para imágenes
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects (si es necesario)
[[redirects]]
  from = "/whatsapp"
  to = "https://wa.me/52228XXXXXXX?text=Hola,%20me%20gustaría%20agendar%20una%20cita"
  status = 301
  force = true

# Redirect de www a non-www (si aplica)
# [[redirects]]
#   from = "https://www.srstudiosalon.com/*"
#   to = "https://srstudiosalon.com/:splat"
#   status = 301
#   force = true

# 404 personalizado (opcional)
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404

# Plugin de optimización de imágenes (opcional pero recomendado)
[[plugins]]
  package = "@netlify/plugin-lighthouse"

